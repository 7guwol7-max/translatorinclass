name: Windows 설치 파일 만들기

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    # v0.1.0 같은 태그를 올려도 Release 를 만든다
    tags: ['v*']
    paths: ['apps/desktop/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/build-windows.yml']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          # 코드 서명 인증서 없이 만든다 (설치 시 SmartScreen 경고가 뜰 수 있음)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomInterpreter-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error

  # 기본 브랜치에 새 버전(apps/desktop/package.json 의 version)이 올라오면
  # 누구나 받을 수 있는 Release(v<버전>)를 만들고 설치 파일을 붙인다. 이미 있는 버전이면 건너뛴다.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClassroomInterpreter-Windows
          path: out
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "태그($GITHUB_REF_NAME)와 apps/desktop/package.json 버전($tag)이 다릅니다" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag 은(는) 이미 배포됐습니다. 새로 배포하려면 package.json 의 version 을 올리세요."
            exit 0
          fi
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "교실 통역 $tag" \
            --notes-file .github/release-notes.md
