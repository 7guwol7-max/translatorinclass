name: Windows 설치 파일 만들기

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/desktop/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/build-windows.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          # 코드 서명 인증서 없이 만든다 (설치 시 SmartScreen 경고가 뜰 수 있음)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomInterpreter-Setup
          path: apps/desktop/release/*.exe
          if-no-files-found: error
