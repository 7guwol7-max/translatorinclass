<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수업 슬라이드 (설명서 그림용)</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Pretendard, sans-serif; }
  body { background: #20242c; display: flex; align-items: center; justify-content: center; }
  .screen { position: relative; width: 1600px; height: 900px; background: linear-gradient(160deg, #f4fbf2 0%, #e4f3df 100%); overflow: hidden; }
  .title { position: absolute; left: 90px; top: 70px; font-size: 64px; font-weight: 800; color: #1d3b1f; letter-spacing: -1px; }
  .title small { display: block; font-size: 30px; font-weight: 600; color: #4b6b4c; margin-top: 10px; letter-spacing: 0; }
  ul { position: absolute; left: 96px; top: 280px; margin: 0; padding: 0 0 0 28px; font-size: 36px; line-height: 1.8; color: #23402a; }
  svg.art { position: absolute; right: 110px; top: 110px; width: 520px; height: 420px; }
  .page { position: absolute; right: 40px; top: 30px; font-size: 22px; color: #6b8a6c; }
  iframe { position: absolute; left: 5%; bottom: 24px; width: 90%; height: 400px; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="screen">
    <div class="page">과학 5학년 · 32쪽</div>
    <div class="title">광합성<small>식물은 어떻게 양분을 만들까요?</small></div>
    <ul>
      <li>빛 에너지를 이용해요</li>
      <li>물과 이산화 탄소가 필요해요</li>
      <li>잎의 엽록체에서 일어나요</li>
    </ul>
    <svg class="art" viewBox="0 0 520 420" aria-hidden="true">
      <circle cx="430" cy="80" r="56" fill="#ffd34d"/>
      <g stroke="#ffc21a" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12">
        <path d="M372 112 300 160M392 132 350 205M418 140 402 222"/>
      </g>
      <path d="M150 400c0-120 40-200 120-250" stroke="#6b4e2e" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M270 150c-90-40-190 10-210 90 90 30 180 0 210-90z" fill="#5cb85c"/>
      <path d="M270 150c40-80 140-110 200-70-20 90-120 120-200 70z" fill="#4aa64a"/>
      <path d="M210 260c-70 10-120 60-120 110 70 10 120-40 120-110z" fill="#67c167"/>
      <text x="40" y="70" font-size="30" fill="#2f6fb5" font-family="Pretendard, sans-serif">CO₂</text>
      <text x="20" y="400" font-size="30" fill="#2f6fb5" font-family="Pretendard, sans-serif">물 H₂O</text>
    </svg>
    <iframe id="overlay" src="/overlay/index.html" title="자막 창"></iframe>
  </div>

</html>
